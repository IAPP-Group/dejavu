# Location of the datasets on disk.
#
# The split CSVs (data/splits/*.csv) store dataset-relative paths whose first
# component is a dataset key, e.g.
#   GenImage/adm_imagenet/ai/0_adm_153.PNG
#   ImageNet/ILSVRC2012_val_00000001_n01751748.JPEG
#   Synthbuster/dalle2/r033bb79dt.png
# The key is replaced by the root below and the rest of the path is kept as is.
# Alternatively, set `data_root` (or pass --data_root) to a folder holding one
# sub-folder per key; roots set here override it.

data_root: null

roots:
  # GenImage (https://github.com/GenImage-Dataset/GenImage): only the fake images of the
  # official evaluation partition are used, expected in <generator>_imagenet/ai/
  # (adm_imagenet/ai, biggan_imagenet/ai, ...); see genimage_layout for other layouts.
  GenImage: /images/GenImage/test
  # Real images of the GenImage splits: the ImageNet (ILSVRC2012) validation images in a single
  # folder, named ILSVRC2012_val_XXXXXXXX_<synset>.JPEG (original name + WordNet id of the class).
  ImageNet: /Prove/Albisani/val_imagenet
  # Synthbuster: folder with dalle2/, dalle3/, firefly/, ...
  Synthbuster: /path/to/synthbuster
  # RAISE-1k (real images of Synthbuster): folder with the r*.TIF files.
  RAISE: /path/to/RAISE-1k
  # AIGIBench: folder containing test/<subset>/{0_real,1_fake}
  AIGIBench: /path/to/AIGIBench
  # CO-SPY-Bench: folder containing Co-Spy-Bench/{real_image_examples,synthetic}
  CO-SPY: /path/to/CO-SPY
  # Community Forensics evaluation set, decoded with tools/prepare_communityforensics.py
  CommunityForensics: /Prove/Bertazzini/Datasets/CommunityForensics-Eval/images

# Optional: where the <generator>_imagenet folders of the CSV paths are inside the GenImage root.
# Leave empty if the GenImage root contains adm_imagenet/ai, biggan_imagenet/ai, ...
# Set `genimage_layout: official` for the official release (ADM/imagenet_ai_0508_adm/val/ai, ...),
# or map single folders, e.g.  adm_imagenet: ADM/imagenet_ai_0508_adm/val
genimage_layout: {}
